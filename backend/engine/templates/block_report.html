<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block report · Gible</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #163a34;
      --ink-muted: #647873;
      --deep: #123b35;
      --deep-2: #0c2925;
      --green: #176b58;
      --mint: #d8ebdf;
      --paper: #f7f5ed;
      --card: #fffefa;
      --line: #d9e1d8;
      --warning: #ad4d21;
      --warning-bg: #fff0df;
      --spade: #423277;
      --heart: #b94353;
      --diamond: #cb701c;
      --club: #138063;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 308px minmax(0, 1fr); }
    .rail {
      background: var(--deep);
      color: #eef7ef;
      min-height: 100vh;
      padding: 28px 18px 24px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow: hidden;
      box-shadow: 7px 0 24px #0e302816;
    }
    .brand { display: flex; gap: 12px; align-items: center; padding: 1px 10px 24px; }
    .brand-mark {
      width: 43px; height: 43px; border-radius: 12px; display: grid; place-items: center;
      background: #e5f1e7; color: var(--deep); font: 700 26px Georgia, serif;
    }
    .brand-name { font: 700 25px Georgia, "Times New Roman", serif; letter-spacing: -.04em; line-height: 1; }
    .brand-sub { font-size: 10px; color: #bad4ca; margin-top: 5px; letter-spacing: .15em; text-transform: uppercase; }
    .rail-heading { border-top: 1px solid #ffffff28; padding: 18px 10px 13px; display: flex; align-items: baseline; justify-content: space-between; }
    .rail-heading strong { font: 700 18px Georgia, "Microsoft YaHei", serif; }
    .rail-heading span { color: #b8d2c8; font-size: 11px; }
    .search-wrap { padding: 0 8px 12px; }
    .search {
      width: 100%; border: 1px solid #ffffff38; border-radius: 9px; outline: none;
      background: #ffffff13; color: #fff; padding: 11px 12px;
    }
    .search::placeholder { color: #b7cec3; }
    .search:focus { border-color: #b1dfc4; box-shadow: 0 0 0 3px #a6d8ba22; }
    .segments { display: flex; gap: 4px; padding: 0 8px 16px; }
    .mode-switch { display: flex; gap: 6px; padding: 0 8px 18px; }
    .mode-switch button { flex: 1; padding: 9px 5px; border-radius: 8px; border: 1px solid #ffffff36; color: #d9e9dd; background: transparent; font-weight: 700; }
    .mode-switch button.active { background: #e3f0e5; color: var(--deep); border-color: #e3f0e5; }
    .segment { flex: 1; color: #bed8cc; background: transparent; border: 1px solid #ffffff28; border-radius: 8px; padding: 8px 2px; font-size: 12px; }
    .segment.active { background: #def1e3; color: var(--deep); border-color: #def1e3; font-weight: 700; }
    .point-list { overflow-y: auto; padding: 0 4px 16px; scrollbar-color: #7aaf99 transparent; }
    .point {
      display: block; width: 100%; text-align: left; border: 1px solid transparent;
      border-radius: 10px; color: #f3f7f0; background: transparent;
      margin-bottom: 7px; padding: 11px 12px;
      transition: background .16s ease, transform .16s ease;
    }
    .point:hover { background: #ffffff10; transform: translateX(2px); }
    .point.active { background: #ecf5eb; color: var(--ink); box-shadow: 0 4px 16px #071f1a29; }
    .point-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .point-auction { font-weight: 700; font-size: 13px; letter-spacing: -.02em; line-height: 1.35; word-break: break-word; }
    .point-count { flex: 0 0 auto; border-radius: 6px; padding: 3px 7px; background: #ffffff1e; font-weight: 800; font-size: 13px; }
    .point.active .point-count { background: #d1e6d8; }
    .point-bottom { margin-top: 6px; opacity: .75; font-size: 11px; }
    .rail-foot { margin-top: auto; border-top: 1px solid #ffffff28; padding: 14px 10px 0; color: #a9c6b9; font-size: 11px; line-height: 1.5; }
    .workspace { min-width: 0; padding: 28px clamp(22px, 3.3vw, 60px) 50px; }
    .kicker { color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 7px 0 0; font: 700 clamp(31px, 3vw, 45px)/1.12 Georgia, "Microsoft YaHei", serif; letter-spacing: -.045em; }
    .profile-line { color: var(--ink-muted); margin: 10px 0 0; font-size: 13px; }
    .summary { display: flex; flex-wrap: wrap; gap: 9px; margin: 27px 0 27px; }
    .metric { background: #fffefa; border: 1px solid var(--line); border-radius: 10px; padding: 10px 15px; min-width: 130px; box-shadow: 0 3px 10px #1f3c2b08; }
    .metric .value { display: block; font: 700 24px Georgia, serif; line-height: 1.1; }
    .metric .label { display: block; margin-top: 4px; font-size: 11px; color: var(--ink-muted); }
    .metric.warning .value { color: var(--warning); }
    .case-detail { border-top: 2px solid var(--deep); padding-top: 19px; }
    .case-toolbar { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .case-title { margin: 0; font: 700 clamp(20px, 2vw, 28px)/1.25 Georgia, "Microsoft YaHei", serif; }
    .case-meta { margin-top: 5px; color: var(--ink-muted); font-size: 12px; }
    .tag { display: inline-block; font-size: 10px; font-weight: 800; border-radius: 4px; padding: 3px 6px; margin-left: 5px; background: #e6eee7; color: #326553; vertical-align: middle; }
    .tag.rare { background: #f7e8ca; color: #845321; }
    .case-nav { display: flex; align-items: center; gap: 8px; }
    .case-nav button { width: 35px; height: 35px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--deep); font-size: 18px; }
    .case-nav button:disabled { opacity: .35; cursor: default; }
    .case-nav span { min-width: 55px; text-align: center; color: var(--ink-muted); font-size: 12px; }
    .content-grid { display: grid; grid-template-columns: minmax(530px, 1.25fr) minmax(320px, .75fr); align-items: start; gap: 18px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 8px 30px #24392b0b; overflow: hidden; }
    .panel-heading { display: flex; align-items: baseline; justify-content: space-between; padding: 15px 18px 12px; border-bottom: 1px solid #e8ece5; }
    .panel-heading h3 { margin: 0; font: 700 17px Georgia, "Microsoft YaHei", serif; }
    .panel-heading span { font-size: 11px; color: var(--ink-muted); }
    .board { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); grid-template-rows: auto auto auto; gap: 10px; padding: 15px; background: radial-gradient(circle at 50% 52%, #edf4e9 0, #f8faf4 52%, #fbfbf6 100%); }
    .hand { background: #fff; border: 1px solid #dce6da; border-radius: 9px; padding: 11px 12px 10px; min-width: 0; box-shadow: 0 3px 9px #1d3d2510; }
    .hand.blocked { outline: 2px solid #d48a52; outline-offset: -2px; background: #fffaf5; }
    .hand.n { grid-column: 2; grid-row: 1; }
    .hand.w { grid-column: 1; grid-row: 2; }
    .hand.e { grid-column: 3; grid-row: 2; }
    .hand.s { grid-column: 2; grid-row: 3; }
    .hand-header { display: flex; align-items: center; gap: 7px; padding-bottom: 7px; border-bottom: 1px solid #edf1e9; }
    .seat-dot { width: 24px; height: 24px; border-radius: 50%; background: #dcece1; color: #21483e; font: 800 13px/24px Georgia, serif; text-align: center; flex: 0 0 auto; }
    .hand-header strong { font-size: 12px; }
    .hand-header .hcp { margin-left: auto; color: var(--ink-muted); font-size: 10px; white-space: nowrap; }
    .hand-shape { font-size: 10px; color: #87958e; padding: 5px 0 3px 31px; }
    .suit-row { display: flex; gap: 8px; align-items: baseline; min-height: 23px; white-space: nowrap; }
    .suit { width: 22px; font: 700 19px Georgia, serif; }
    .suit.s { color: var(--spade); }.suit.h { color: var(--heart); }.suit.d { color: var(--diamond); }.suit.c { color: var(--club); }
    .holding { font: 700 15px/1.25 Georgia, "Times New Roman", serif; letter-spacing: .035em; overflow: hidden; text-overflow: ellipsis; }
    .compass { grid-column: 2; grid-row: 2; align-self: center; justify-self: center; width: 108px; height: 108px; border-radius: 50%; border: 1px solid #b9d0c1; background: #e5f0e7; display: flex; align-items: center; justify-content: center; color: #527665; position: relative; font: 700 11px Georgia, serif; box-shadow: inset 0 0 0 7px #f6faf3; }
    .compass span { position: absolute; }.compass .cn { top: 13px; }.compass .cs { bottom: 13px; }.compass .cw { left: 15px; }.compass .ce { right: 15px; }
    .compass .center { font-size: 27px; color: var(--green); }
    .right-stack { display: grid; gap: 18px; }
    .auction-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 5px; padding: 14px; }
    .column-head { background: #e1eee4; border-radius: 5px; text-align: center; padding: 8px 2px; color: #245545; font-size: 11px; font-weight: 800; }
    .auction-cell { min-height: 54px; background: #f7f8f4; border: 1px solid #e5eae2; border-radius: 6px; text-align: center; padding: 7px 2px 5px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .auction-cell.blank { background: transparent; border-color: transparent; }
    .auction-cell.block { border: 1px solid #e7ae76; background: var(--warning-bg); color: #9f4a23; }
    .bid { font: 800 18px Georgia, "Microsoft YaHei", serif; line-height: 1; white-space: nowrap; }
    .bid .suit-symbol.s { color: var(--spade); }.bid .suit-symbol.h { color: var(--heart); }.bid .suit-symbol.d { color: var(--diamond); }.bid .suit-symbol.c { color: var(--club); }
    .bid.pass { color: var(--green); font-size: 14px; }
    .source { color: #8d9b93; font-size: 9px; margin-top: 5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .diagnostics { padding: 16px 18px 18px; }
    .diagnostic-title { font-size: 13px; font-weight: 800; margin: 0 0 9px; color: #8e441f; }
    .diagnostic { margin: 0 0 8px; color: #674f3a; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .error-code { display: inline-block; border: 1px solid #edc29c; color: #8b4b24; background: #fff8ef; border-radius: 5px; padding: 4px 6px; font-size: 10px; font-weight: 800; margin: 3px 4px 0 0; }
    .rate-row { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ecede6; padding: 8px 0; font-size: 12px; }
    .rate-row strong { color: var(--warning); font-size: 15px; }
    .rate-row:last-child { border: 0; }
    .note { color: var(--ink-muted); font-size: 11px; line-height: 1.5; margin-top: 18px; }
    .empty { background: var(--card); border: 1px dashed #bdcbc0; border-radius: 13px; padding: 42px 28px; color: var(--ink-muted); line-height: 1.6; }
    .empty strong { color: var(--ink); display: block; font: 700 23px Georgia, "Microsoft YaHei", serif; margin-bottom: 8px; }
    [hidden] { display: none !important; }
    @media (max-width: 1320px) { .content-grid { grid-template-columns: 1fr; } .board { max-width: 820px; margin: auto; } }
    @media (max-width: 800px) {
      .shell { display: block; }
      .rail { position: static; min-height: auto; max-height: none; padding: 15px; }
      .brand { padding-bottom: 10px; }.rail-heading { padding-top: 11px; }
      .point-list { max-height: 190px; }.rail-foot { display: none; }
      .workspace { padding: 24px 16px 40px; }
    }
    @media (max-width: 570px) {
      .board { grid-template-columns: repeat(2,minmax(0,1fr)); grid-template-rows: repeat(2,auto); }
      .hand.n { grid-column: 1; grid-row: 1; }.hand.e { grid-column: 2; grid-row: 1; }
      .hand.s { grid-column: 1; grid-row: 2; }.hand.w { grid-column: 2; grid-row: 2; }
      .compass { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="阻塞进程列表">
      <div class="brand"><div class="brand-mark">G</div><div><div class="brand-name">Gible</div><div class="brand-sub">Bidding audit deck</div></div></div>
      <div id="mode-switch" class="mode-switch" hidden><button class="active" type="button" data-mode="blocked">阻塞</button><button type="button" data-mode="suspicious">可疑</button><button type="button" data-mode="all">全部牌例</button></div>
      <div class="rail-heading"><strong id="rail-title">阻塞进程</strong><span id="point-total"></span></div>
      <div class="search-wrap"><input id="search" class="search" type="search" placeholder="搜索牌号、叫牌或座位" aria-label="搜索牌例"></div>
      <div id="stratum-segments" class="segments" role="group" aria-label="样本类型">
        <button class="segment active" data-stratum="all" type="button">全部</button>
        <button class="segment" data-stratum="natural" type="button">普通</button>
        <button class="segment" data-stratum="rare_hcp" type="button">稀有</button>
      </div>
      <div id="point-list" class="point-list"></div>
      <div id="rail-foot" class="rail-foot">本报告保留原始发牌种子与每副牌的完整叫牌轨迹。稀有层是人为加权的测试样本。</div>
    </aside>
    <main class="workspace">
      <div class="title-row"><div><div class="kicker">Gible / Auction diagnostics</div><h1 id="report-title">阻塞牌例图谱</h1><p id="profile-line" class="profile-line"></p></div></div>
      <div id="summary" class="summary" aria-label="扫描摘要"></div>
      <div id="empty" class="empty" hidden></div>
      <article id="case-detail" class="case-detail" data-testid="case-detail" hidden>
        <div class="case-toolbar"><div><h2 id="case-title" class="case-title"></h2><div id="case-meta" class="case-meta"></div></div><div class="case-nav"><button id="prev" type="button" aria-label="上一副牌">‹</button><span id="case-position"></span><button id="next" type="button" aria-label="下一副牌">›</button></div></div>
        <div class="content-grid">
          <section class="panel"><div class="panel-heading"><h3>四家手牌</h3><span>♠  ♥  ♦  ♣</span></div><div id="board" class="board" data-testid="board"></div></section>
          <div class="right-stack">
            <section class="panel"><div class="panel-heading"><h3>叫牌进程</h3><span id="auction-count"></span></div><div id="auction-grid" class="auction-grid" data-testid="auction-grid"></div></section>
            <section class="panel"><div class="panel-heading"><h3 id="diagnostic-heading">阻塞诊断</h3><span id="blocked-seat"></span></div><div id="diagnostics" class="diagnostics"></div></section>
          </div>
        </div>
        <p id="report-note" class="note">这是一份测试证据：阻塞不等于该牌应叫某一口。下一步须核对体系文件，再决定如何补规则。</p>
      </article>
    </main>
  </div>
  <script>
    const REPORT = __BLOCK_REPORT_JSON__;
    (() => {
      const seats = ['n','e','s','w'];
      const names = {n:'北', e:'东', s:'南', w:'西'};
      const suitSymbols = {S:'♠', H:'♥', D:'♦', C:'♣'};
      const points = REPORT.block_points || [];
      const cases = REPORT.cases || [];
      const coverage = REPORT.schema_version === 2;
      const constrained = REPORT.filters?.mode === 'constrained';
      const dealNumber = item => `#${String(item.id ?? item.trial).padStart(4, '0')}`;
      const allPoints = coverage ? [...cases, ...(REPORT.complete_cases || []), ...(REPORT.limit_cases || [])]
        .sort((a, b) => a.trial - b.trial)
        .map(item => ({id:item.id ?? item.trial, auction:item.auction,
                       seat:item.blocked?.seat || item.declarer, case:item})) : [];
      const suspiciousById = new Map((REPORT.suspicious_cases || []).map(item => [item.id, item]));
      const suspiciousPoints = (REPORT.suspicious_groups ||
        [...suspiciousById.keys()].map(id => [id])).map((ids, index) => {
        const members = ids.map(id => suspiciousById.get(id)).filter(Boolean);
        return {id:`group-${index}`, auction:members[0]?.auction || '',
                case:members[0], cases:members, count:members.length};
      }).filter(point => point.count);
      const state = {mode:'blocked', stratum:'all', query:'', selected:null, index:0};
      const byId = id => document.getElementById(id);
      const elt = (tag, className, content) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (content !== undefined) node.textContent = String(content);
        return node;
      };
      const keyOf = point => point.id ? `suspicious:${point.id}` : `${point.auction}|${point.seat}`;
      const readable = compact => (compact.match(/XX|X|P|[1-7][NCDHS]/g) || [compact]).map(call => {
        const suit = call.slice(-1);
        return /^[1-7][CDHS]$/.test(call) ? call[0] + suitSymbols[suit] : call.endsWith('N') ? call[0] + 'NT' : call === 'P' ? 'Pass' : call;
      }).join(' · ');
      const handParts = text => {
        const result = {S:'', H:'', D:'', C:''};
        for (const match of String(text || '').matchAll(/([SHDC])([^SHDC]*)/g)) result[match[1]] = match[2].replace('-', '');
        return result;
      };
      const handHcp = parts => Object.values(parts).join('').split('').reduce((sum, rank) => sum + ({A:4,K:3,Q:2,J:1}[rank] || 0), 0);
      const stratumName = value => value === 'rare_hcp' ? '稀有点力层' : '普通随机层';
      const caseKey = item => `${item.blocked?.auction || item.auction}|${item.blocked?.seat || ''}`;
      const available = point => state.mode === 'suspicious' ? point.cases : state.mode === 'all' ? [point.case] :
        cases.filter(item => caseKey(item) === keyOf(point) && (state.stratum === 'all' || item.stratum === state.stratum));
      const activePoints = () => state.mode === 'all' ? allPoints : state.mode === 'suspicious' ? suspiciousPoints : points;
      const visiblePoints = () => activePoints().filter(point => {
        const numberQuery = state.query.trim().match(/^#?(\d+)$/);
        if (numberQuery) {
          const number = Number(numberQuery[1]);
          return state.mode === 'blocked'
            ? cases.some(item => caseKey(item) === keyOf(point) && (item.id ?? item.trial) === number)
            : available(point).some(item => (item.id ?? item.trial) === number);
        }
        if (state.mode !== 'blocked') {
          const search = state.query.toUpperCase();
          return !search || available(point).some(item =>
            readable(item.auction).toUpperCase().includes(search)
            || (item.contract || '').toUpperCase().includes(search)
            || dealNumber(item).toUpperCase().includes(search));
        }
        if (state.stratum !== 'all' && !(point.strata && point.strata[state.stratum])) return false;
        const query = state.query.replace(/\s/g, '').toUpperCase();
        return !query || point.auction.toUpperCase().includes(query) || readable(point.auction).replace(/\s/g, '').toUpperCase().includes(query) || names[point.seat].includes(state.query);
      });
      function metric(value, label, warning=false) {
        const box = elt('div', 'metric' + (warning ? ' warning' : ''));
        box.append(elt('span','value',value), elt('span','label',label));
        return box;
      }
      function setupSummary() {
        const summary = REPORT.summary || {};
        byId('profile-line').textContent = `${REPORT.profile?.name || REPORT.profile?.id || 'Profile'} · seed ${REPORT.seed ?? '—'} · ${REPORT.filters?.opening ? '指定开叫 ' + readable(REPORT.filters.opening) : '全部开叫'}`;
        if (constrained) {
          const north = REPORT.constraints?.north || {};
          const south = REPORT.constraints?.south || {};
          const describe = rule => `${rule.shape?.join('–') ?? '?'} / HCP ${rule.hcp?.join('–') ?? '?'} / K–R ${rule.kr?.join('–') ?? '?'}`;
          byId('profile-line').textContent = `${REPORT.profile?.name || REPORT.profile?.id || 'Profile'} · seed ${REPORT.seed ?? '—'} · 北 ${describe(north)} · 南 ${describe(south)}`;
          byId('mode-switch').hidden = false;
          byId('mode-switch').querySelector('[data-mode="suspicious"]').hidden = true;
          byId('stratum-segments').hidden = true;
          byId('report-title').textContent = '定向发牌叫牌结果';
          byId('rail-foot').textContent = '南北两家按各自手牌与所选体系自动叫牌；东西两家不叫。牌型、HCP 和 K–R 均按指定区间发牌。';
          byId('summary').replaceChildren(
            metric(summary.pairs ?? 0, '已发牌'),
            metric(summary.complete ?? 0, '完成叫牌'),
            metric(summary.blocked ?? 0, '阻塞牌例', true),
            metric(summary.limit ?? 0, '达到叫牌上限'),
            metric(points.length, '不同阻塞进程')
          );
          return;
        }
        if (coverage) {
          const limits = REPORT.coverage || {};
          byId('profile-line').textContent += ` · 南家 HCP ${limits.responder_hcp?.[0] ?? '?'}–${limits.responder_hcp?.at(-1) ?? '?'} · 最长套 ${limits.longest_suit?.[0] ?? '?'}–${limits.longest_suit?.at(-1) ?? '?'} · 两门最长 ${limits.top_two_suits?.[0] ?? '?'}–${limits.top_two_suits?.at(-1) ?? '?'}`;
          byId('mode-switch').hidden = false;
          byId('stratum-segments').hidden = true;
          byId('report-title').textContent = '叫牌扫描图谱';
          byId('rail-foot').textContent = '北家统一开叫 1NT；南家按点力和牌型配额发牌。可疑率由 DDS 双明手在同类牌中估计，并非实战完成率。';
          byId('summary').replaceChildren(
            metric(summary.pairs ?? 0, '南北牌组'),
            metric(`${limits.cells?.length ?? 0} / ${(REPORT.filters?.hcp_targets?.length || 0) * (REPORT.filters?.shapes?.length || 0)}`, '点力 × 牌型格子'),
            metric(summary.blocked ?? 0, '阻塞牌组', true),
            metric(summary.complete ?? 0, '完成叫牌'),
            metric(summary.suspicious ?? 0, '可疑牌例', true),
            metric(suspiciousPoints.length, '可疑类别'),
            metric(summary.unassessed ?? 0, '同类证据不足'),
            metric(summary.dds_boards ?? 0, 'DDS 发牌求解')
          );
          return;
        }
        byId('summary').replaceChildren(
          metric(summary.attempts ?? 0, '发牌尝试'),
          metric(summary.auction_matches ?? 0, '符合条件的叫牌'),
          metric(summary.blocked ?? 0, '阻塞牌例', true),
          metric(points.length, '不同阻塞进程')
        );
        const rare = summary.strata?.rare_hcp;
        if (rare) byId('summary').append(metric(`${rare.attempts ?? 0} / ${rare.auction_matches ?? 0}`, '稀有层尝试 / 匹配'));
      }
      function renderPoints() {
        const shown = visiblePoints();
        byId('rail-title').textContent = state.mode === 'all' ? '全部牌例' : state.mode === 'suspicious' ? '可疑类别' : '阻塞进程';
        byId('point-total').textContent = `${shown.length} / ${activePoints().length}`;
        if (!shown.some(point => keyOf(point) === state.selected)) {
          state.selected = shown.length ? keyOf(shown[0]) : null;
          state.index = 0;
        }
        if (/^#?\d+$/.test(state.query.trim())) {
          const selectedPoint = shown.find(point => keyOf(point) === state.selected);
          const number = state.query.trim().replace(/^#/, '');
          const matchingIndex = selectedPoint ? available(selectedPoint).findIndex(item =>
            dealNumber(item).slice(1) === number || String(item.id ?? item.trial) === number) : -1;
          if (matchingIndex >= 0) state.index = matchingIndex;
        }
        const list = byId('point-list');
        list.replaceChildren();
        if (!shown.length) list.append(elt('p','rail-foot','没有匹配的阻塞进程。'));
        for (const point of shown) {
          const item = elt('button','point' + (keyOf(point) === state.selected ? ' active' : ''));
          item.type = 'button';
          item.dataset.point = keyOf(point);
          item.setAttribute('aria-current', keyOf(point) === state.selected ? 'true' : 'false');
          const top = elt('div','point-top');
          top.append(elt('span','point-auction',state.mode === 'all' ? `${dealNumber(point.case)} · ${readable(point.auction)}` :
                     state.mode === 'suspicious' ? `北 ${point.case.north_shape.join('–')} · 南 ${point.case.south_shape.join('–')}` : readable(point.auction)),
                     elt('span','point-count',state.mode === 'blocked' ? point.count : state.mode === 'suspicious' ? `${point.count} 副` : point.case.contract || (point.case.status === 'limit' ? 'LIMIT' : point.case.blocked ? 'BLOCK 卡' : 'PASSOUT')));
          const counts = point.strata || {};
          const detail = state.mode === 'all'
            ? `${point.case.blocked ? '阻塞' : point.case.status === 'limit' ? '达到上限' : '完成'} · 南家 ${point.case.south_hcp} HCP · ${point.case.south_shape.join('–')}`
            : state.mode === 'suspicious'
            ? `牌号 ${point.cases.map(dealNumber).join('、')} · HCP/K–R 各差 ≤2`
            : coverage ? `阻塞：${names[point.seat] || point.seat}家 · 第 ${point.first_trial} 副首次出现`
            : `阻塞：${names[point.seat] || point.seat}家 · 普通 ${counts.natural || 0} / 稀有 ${counts.rare_hcp || 0}`;
          item.append(top, elt('div','point-bottom',detail));
          item.addEventListener('click', () => { state.selected = keyOf(point); state.index = 0; renderPoints(); });
          list.append(item);
        }
        renderCase();
      }
      function handNode(seat, hand, dealer, blocked) {
        const parts = handParts(hand);
        const panel = elt('div',`hand ${seat}` + (seat === blocked ? ' blocked' : ''));
        panel.dataset.seat = seat;
        const header = elt('div','hand-header');
        header.append(elt('span','seat-dot',seat.toUpperCase()), elt('strong','',`${names[seat]}家`));
        if (seat === dealer) header.append(elt('span','tag','发牌人'));
        header.append(elt('span','hcp',`${handHcp(parts)} HCP`));
        panel.append(header, elt('div','hand-shape',`${'SHDC'.split('').map(s => parts[s].length).join('–')} 牌型`));
        for (const suit of 'SHDC') {
          const row = elt('div','suit-row');
          row.append(elt('span',`suit ${suit.toLowerCase()}`,suitSymbols[suit]),
                     elt('span','holding',parts[suit] || '—'));
          panel.append(row);
        }
        return panel;
      }
      function renderBoard(item) {
        const board = byId('board');
        const compass = elt('div','compass');
        for (const [name, label] of [['cn','N'],['ce','E'],['cs','S'],['cw','W']]) compass.append(elt('span',name,label));
        compass.append(elt('div','center','◆'));
        board.replaceChildren(...['n','w','e','s'].map(seat => handNode(seat,item.hands?.[seat],item.dealer,item.blocked?.seat)),compass);
      }
      function bidNode(call) {
        const bid = elt('div','bid' + (call === 'P' ? ' pass' : ''));
        if (call === 'P') { bid.textContent = 'Pass'; return bid; }
        if (/^[1-7][CDHS]$/.test(call)) {
          bid.append(document.createTextNode(call[0]));
          bid.append(elt('span',`suit-symbol ${call[1].toLowerCase()}`,suitSymbols[call[1]]));
        } else bid.textContent = call.endsWith('N') ? call[0] + 'NT' : call;
        return bid;
      }
      function renderAuction(item) {
        const grid = byId('auction-grid');
        grid.replaceChildren(...seats.map(seat => elt('div','column-head',names[seat] + ' ' + seat.toUpperCase())));
        const start = seats.indexOf(item.dealer);
        const rows = Math.floor((start + item.calls.length - (item.blocked ? 0 : 1)) / 4) + 1;
        const cells = Array.from({length:rows}, () => Array(4).fill(null));
        (item.history || []).forEach((record,index) => {
          const absolute = start + index;
          cells[Math.floor(absolute / 4)][absolute % 4] = {call:record.call, source:record.source_id};
        });
        if (item.blocked) {
          const blockedIndex = start + item.calls.length;
          cells[Math.floor(blockedIndex / 4)][blockedIndex % 4] = {blocked:true};
        }
        for (const row of cells) for (const info of row) {
          const cell = elt('div','auction-cell' + (!info ? ' blank' : info.blocked ? ' block' : ''));
          if (info?.blocked) cell.append(elt('strong','bid','BLOCK 卡'));
          else if (info) { cell.append(bidNode(info.call)); if (info.source) cell.append(elt('span','source',info.source)); }
          grid.append(cell);
        }
        byId('auction-count').textContent = `${item.calls.length} 口已叫`;
      }
      function renderDiagnostics(item) {
        const panel = byId('diagnostics');
        if (constrained && !item.blocked) {
          byId('diagnostic-heading').textContent = item.status === 'limit' ? '停止原因' : '叫牌结果';
          byId('blocked-seat').textContent = item.contract || (item.status === 'limit' ? 'LIMIT' : '流局');
          panel.replaceChildren(elt('p','diagnostic-title',item.status === 'limit'
            ? '叫牌达到设定的最大口数' : item.contract ? `最终定约 ${item.contract}` : '四家不叫，流局'));
          for (const message of item.diagnostics || []) panel.append(elt('p','diagnostic',message));
          panel.append(elt('p','diagnostic','本报告只运行自动叫牌，没有进行 DDS 定约分析。'));
          return;
        }
        if (!item.blocked) {
          const analysis = item.analysis || {};
          const labels = {contract_failure:'所叫定约宕掉', wrong_game:'打错局：所选局/最佳替代局成功赔率比 < 0.8', missed_game:'有可打成局却未叫到',
                          missed_small_slam:'有可打小满贯却未叫到',
                          missed_grand_slam:'有可打大满贯却未叫到'};
          byId('diagnostic-heading').textContent = 'DDS 可疑指标';
          byId('blocked-seat').textContent = item.contract;
          panel.replaceChildren(elt('p','diagnostic-title',
            `同类 ${analysis.class_pairs} 组南北牌 · ${analysis.dds_boards} 副 DDS 求解`));
          for (const flag of analysis.flags || []) {
            const row = elt('div','rate-row');
            const value = analysis.rates?.[flag];
            row.append(elt('span','',labels[flag]),
              elt('strong','',flag === 'wrong_game' ? `OR ${Number(value || 0).toFixed(2)}` : `${Math.round((value || 0)*100)}%`));
            panel.append(row);
          }
          if ((analysis.flags || []).includes('wrong_game')) {
            const alternatives = Object.entries(analysis.alternative_game_rates || {})
              .filter(([, rate]) => rate > 0)
              .map(([contract, rate]) => `${contract} ${Math.round(rate*100)}%`);
            if (alternatives.length) panel.append(elt('p','diagnostic',
              `可成的替代局：${alternatives.join('、')}。各项可能在同一副牌上重叠。`));
          }
          panel.append(elt('p','diagnostic','同类指两家各自的四门张数完全相同，且两家各自的 HCP 与 K–R 点力差距均不超过 2。DDS 双明手结果仅供筛查，不能代表实战打牌成功率。'));
          if (analysis.class_pairs === 1) panel.append(elt('p','diagnostic','本例只有 1 组独立南北牌；百分比来自这组牌的多次东西补全，证据较薄。'));
          return;
        }
        byId('diagnostic-heading').textContent = '阻塞诊断';
        panel.replaceChildren(elt('p','diagnostic-title',`${names[item.blocked?.seat] || item.blocked?.seat}家轮到叫牌，进程停止`));
        const diagnostics = item.blocked?.diagnostics || [];
        for (const message of diagnostics) panel.append(elt('p','diagnostic',message));
        if (!diagnostics.length) panel.append(elt('p','diagnostic','没有进一步的诊断文本。'));
        for (const error of item.blocked?.axioms?.errors || []) panel.append(elt('span','error-code',error.code || 'AXIOM'));
        byId('blocked-seat').textContent = `${names[item.blocked?.seat] || item.blocked?.seat}家`;
      }
      function renderCase() {
        const point = activePoints().find(candidate => keyOf(candidate) === state.selected);
        const subset = point ? available(point) : [];
        if (!subset.length) {
          byId('case-detail').hidden = true;
          const empty = byId('empty');
          empty.hidden = false;
          empty.replaceChildren(elt('strong','',point ? '此进程尚无保存的牌例' : '没有匹配的牌例'),
            document.createTextNode(point ? '扫描报告保留了这个阻塞进程的次数，但未保存对应手牌。重新扫描时提高 --max-cases。' : '调整左侧筛选条件，或使用扫描器生成含 block 的报告。'));
          return;
        }
        if (state.index >= subset.length) state.index = subset.length - 1;
        const item = subset[state.index];
        byId('empty').hidden = true;
        byId('case-detail').hidden = false;
        byId('case-title').textContent = `${dealNumber(item)} · ` + (item.blocked
          ? `${readable(item.auction)}  →  ${names[item.blocked.seat] || item.blocked.seat}家阻塞`
          : `${readable(item.auction)}  →  ${item.status === 'limit' ? '达到叫牌上限' : item.contract || '流局'}${item.analysis?.flags?.length ? ' 可疑' : ''}`);
        const meta = byId('case-meta');
        meta.replaceChildren(document.createTextNode(`牌号 ${dealNumber(item)} · 第 ${item.trial} 次发牌 · ${names[item.dealer]}家开叫 · `));
        if (coverage) meta.append(elt('span','tag',
          `北 ${item.north_hcp} HCP / KR ${item.north_kr} · 南 ${item.south_hcp} HCP / KR ${item.south_kr}`));
        else meta.append(elt('span','tag' + (item.stratum === 'rare_hcp' ? ' rare' : ''),stratumName(item.stratum)));
        byId('report-note').textContent = constrained
          ? '这份报告记录南北两家自动叫牌的结果；东西两家不叫。它没有运行 DDS，也不评估定约完成率。'
          : !item.blocked
          ? '可疑率用于定位需要复核的叫牌进程。样本由人为配额发牌，DDS 为双明手代理结果；不能直接推断真实牌局胜率。'
          : '这是一份测试证据：阻塞不等于该牌应叫某一口。下一步须核对体系文件，再决定如何补规则。';
        byId('case-position').textContent = `${state.index + 1} / ${subset.length}`;
        byId('prev').disabled = state.index === 0;
        byId('next').disabled = state.index === subset.length - 1;
        renderBoard(item);
        renderAuction(item);
        renderDiagnostics(item);
      }
      byId('search').addEventListener('input', event => { state.query = event.target.value; renderPoints(); });
      for (const button of document.querySelectorAll('#mode-switch button')) button.addEventListener('click', () => {
        state.mode = button.dataset.mode;
        state.selected = null;
        state.index = 0;
        for (const other of document.querySelectorAll('#mode-switch button')) other.classList.toggle('active',other === button);
        renderPoints();
      });
      for (const button of document.querySelectorAll('.segment')) button.addEventListener('click', () => {
        state.stratum = button.dataset.stratum;
        for (const other of document.querySelectorAll('.segment')) other.classList.toggle('active',other === button);
        renderPoints();
      });
      byId('prev').addEventListener('click', () => { state.index--; renderCase(); });
      byId('next').addEventListener('click', () => { state.index++; renderCase(); });
      document.addEventListener('keydown', event => {
        if (event.target instanceof HTMLInputElement) return;
        if (event.key === 'ArrowLeft' && !byId('prev').disabled) { state.index--; renderCase(); }
        if (event.key === 'ArrowRight' && !byId('next').disabled) { state.index++; renderCase(); }
      });
      setupSummary();
      renderPoints();
    })();
  </script>
</body>
</html>
