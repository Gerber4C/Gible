call_specifications:
  - id: cs_1
    description: Asker bids 4D as Minorwood keycard for diamonds.
    system_notes: With diamonds agreed, 4D asks for diamond keycards using 1430 steps.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: agreed_suit
            suit: D
        - not:
            fact_exists:
              fact_type: keycard_context
              status: pending
        - not:
            fact_exists:
              fact_type: final_contract
    call: 4D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: diamond_slam_values
          evaluator: min_value
          input: self.hcp
          min: 12
          weight: 80
        - criterion_id: six_diamonds
          evaluator: min_value
          input: self.diamonds
          min: 6
          weight: 90
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [inquiry, keycard_asking, context_initiating]
      action_type: minorwood_1430
      target_suit: D
      alertable: true
    effects:
      - fact_type: keycard_context
        trump_suit: D
        method: minorwood_1430
        status: pending

  - id: cs_2
    description: Responder to diamond Minorwood answers 4H, showing 1 or 4 keycards.
    system_notes: Over 4D Minorwood, 4H shows 1 or 4 keycards.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: keycard_context
            method: minorwood_1430
            trump_suit: D
            status: pending
        - not:
            fact_exists:
              fact_type: keycard_response
              method: minorwood_1430
    call: 4H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: one_or_four_keycards
          evaluator: expression
          expr:
            op: in
            left:
              op: keycard_count
              hand: self
              trump_suit: D
            right: {const: [1, 4]}
          weight: 100
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: keycard_response
      keycard_range: [1, 4]
      alertable: true
    effects:
      - fact_type: keycard_response
        trump_suit: D
        method: minorwood_1430
        response: one_or_four

  - id: cs_3
    description: Responder to diamond Minorwood answers 4S, showing 0 or 3 keycards.
    system_notes: Over 4D Minorwood, 4S shows 0 or 3 keycards.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: keycard_context
            method: minorwood_1430
            trump_suit: D
            status: pending
        - not:
            fact_exists:
              fact_type: keycard_response
              method: minorwood_1430
    call: 4S
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: zero_or_three_keycards
          evaluator: expression
          expr:
            op: in
            left:
              op: keycard_count
              hand: self
              trump_suit: D
            right: {const: [0, 3]}
          weight: 100
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: keycard_response
      keycard_range: [0, 3]
      alertable: true
    effects:
      - fact_type: keycard_response
        trump_suit: D
        method: minorwood_1430
        response: zero_or_three

  - id: cs_4
    description: Responder to diamond Minorwood answers 4N, showing two keycards without the diamond queen.
    system_notes: Over 4D Minorwood, 4N shows 2 keycards without the diamond queen.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: keycard_context
            method: minorwood_1430
            trump_suit: D
            status: pending
        - not:
            fact_exists:
              fact_type: keycard_response
              method: minorwood_1430
    call: 4N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: two_keycards
          evaluator: expression
          expr:
            op: eq
            left:
              op: keycard_count
              hand: self
              trump_suit: D
            right: {const: 2}
          weight: 100
        - criterion_id: lacks_diamond_queen
          evaluator: expression
          expr:
            op: not
            arg:
              op: contains_rank
              hand: self
              suit: D
              rank: Q
          weight: 20
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: keycard_response
      keycard_count: 2
      trump_queen: false
      alertable: true
    effects:
      - fact_type: keycard_response
        trump_suit: D
        method: minorwood_1430
        response: two_without_queen

  - id: cs_5
    description: Responder to diamond Minorwood answers 5C, showing two keycards with the diamond queen.
    system_notes: Over 4D Minorwood, 5C shows 2 keycards with the diamond queen.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
