    call: 5C
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: two_keycards
          evaluator: expression
          expr:
            op: eq
            left:
              op: keycard_count
              hand: self
              trump_suit: D
            right: {const: 2}
          weight: 100
        - criterion_id: has_diamond_queen
          evaluator: expression
          expr:
            op: contains_rank
            hand: self
            suit: D
            rank: Q
          weight: 20
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: keycard_response
      keycard_count: 2
      trump_queen: true
      alertable: true
    effects:
      - fact_type: keycard_response
        trump_suit: D
        method: minorwood_1430
        response: two_with_queen
