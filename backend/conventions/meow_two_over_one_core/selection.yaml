call_selection_policies:
  - id: policy_1
    description: Opening selection for the benchmark slice. Prefer 15-17 balanced 1N over a five-card major when both are eligible, then choose five-card majors before minor openings.
    scope:
      context:
        auction_pattern: ""
        seat_positions: [1, 2, 3, 4]
    algorithm: ordered_condition
    tie_breaker: diagnose
    choices:
      - choose_call: 1N
        when:
          all:
            - self.hcp: {min: 15, max: 17}
            - self.balanced: true
      - choose_call: 1S
        when:
          all:
            - self.hcp: {min: 12}
            - self.spades: {min: 5}
      - choose_call: 1H
        when:
          all:
            - self.hcp: {min: 12}
            - self.hearts: {min: 5}
      - choose_call: 1D
        when:
          all:
            - self.hcp: {min: 12}
            - self.diamonds: {min: 4}
            - self.hearts: {max: 4}
            - self.spades: {max: 4}
            - expr:
                op: gte
                left:
                  op: length
                  hand: self
                  suit: D
                right:
                  op: length
                  hand: self
                  suit: C
      - choose_call: 1C
        when:
          all:
            - self.hcp: {min: 12}
            - self.clubs: {min: 3}
            - self.hearts: {max: 4}
            - self.spades: {max: 4}
    fallback: highest_score
