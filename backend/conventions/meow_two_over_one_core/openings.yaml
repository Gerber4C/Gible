call_specifications:
  - id: cs_1
    description: Opens 1S naturally with opening values and at least five spades.
    system_notes: 1S opening is natural and shows at least five spades.
    context:
      auction_pattern: ""
      seat_positions: [1, 2]
    call: 1S
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: opening_values
          evaluator: min_value
          input: self.hcp
          min: 12
          weight: 40
        - criterion_id: five_spades
          evaluator: min_value
          input: self.spades
          min: 5
          weight: 70
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive, context_initiating]
      action_type: opening
      target_suit: S
      shown_length_min: 5
      alertable: false
    effects:
      - fact_type: major_opening
        actor_role: opener
        target_suit: S
        shown_length_min: 5

  - id: cs_2
    description: Opens 1H naturally with opening values and at least five hearts.
    system_notes: 1H opening is natural and shows at least five hearts.
    context:
      auction_pattern: ""
      seat_positions: [1, 2]
    call: 1H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: opening_values
          evaluator: min_value
          input: self.hcp
          min: 12
          weight: 40
        - criterion_id: five_hearts
          evaluator: min_value
          input: self.hearts
