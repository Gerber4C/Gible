call_specifications:
  - id: cs_5
    description: Explicit fallback pass when no benchmark Call Specification applies.
    system_notes: Undefined benchmark auctions currently fall back to pass with diagnostics.
    default_policy: true
    context:
      auction_pattern: "*"
    call: P
    meaning:
      nature_labels: [default]
      call_act_types: [final_placement]
      action_type: fallback_pass
      alertable: false

  - id: cs_6
    description: Partner passes after a final contract has been placed by any loaded benchmark Convention.
    system_notes: Once a final contract semantic fact exists, pass is the normal continuation.
    context:
      auction_pattern: "*"
    requires:
      fact_exists:
        fact_type: final_contract
    call: P
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: final_contract_exists
          evaluator: fact_exists
          query:
            fact_type: final_contract
          weight: 1
    meaning:
      nature_labels: [natural]
      call_act_types: [final_placement]
      action_type: pass_final_contract
      alertable: false
