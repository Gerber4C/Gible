call_specifications:
  - id: cs_1
    description: Responder bids 4N as a quantitative notrump slam invitation.
    system_notes: With notrump focus and no agreed suit, 4N is quantitative.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: notrump_focus
            status: active
        - not:
            fact_exists:
              fact_type: agreed_suit
        - not:
            fact_exists:
              fact_type: transfer
              status: pending
        - not:
            fact_exists:
              fact_type: stayman
              status: pending
        - not:
            fact_exists:
              fact_type: puppet_stayman
              status: pending
        - not:
            fact_exists:
              fact_type: final_contract
    call: 4N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: quantitative_slam_invite_values
          evaluator: range_contains
          input: self.hcp
          min: 16
          max: 17
          weight: 120
        - criterion_id: balanced_shape
          evaluator: equals
          input: self.balanced
          value: true
          weight: 40
    meaning:
      nature_labels: [natural]
      call_act_types: [invitation]
      action_type: quantitative_notrump_invite
      target_suit: N
      level: 4
      alertable: false
    effects:
      - fact_type: quantitative_notrump_invite
        target_suit: N
        level: 4
        status: pending
