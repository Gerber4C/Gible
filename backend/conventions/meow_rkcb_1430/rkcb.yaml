  - id: cs_8
    description: Asker places the grand slam in spades after the diamond king is shown.
    system_notes: 7S is final placement after the RKCB and specific-king route.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: all_keycards_known
            trump_suit: S
            status: "yes"
        - fact_exists:
            fact_type: specific_king_response
            trump_suit: S
            target_suit: D
            rank: K
        - not:
            fact_exists:
              fact_type: final_contract
    call: 7S
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: final_grand_strength
          evaluator: min_value
          input: self.hcp
          min: 18
          weight: 100
        - criterion_id: six_spades
          evaluator: min_value
          input: self.spades
          min: 6
          weight: 20
    meaning:
      nature_labels: [natural]
      call_act_types: [final_placement]
      action_type: place_contract
      target_suit: S
      level: 7
      alertable: false
    effects:
      - fact_type: final_contract
        target_suit: S
        level: 7
        source: rkcb_1430

