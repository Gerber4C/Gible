  - id: cs_6
    description: Asker bids 5N to ask for specific kings after accounting for all keycards.
    system_notes: 5N asks for specific kings and guarantees all keycards in this benchmark route.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: keycard_response
            method: "1430"
            response: one_or_four
        - not:
            fact_exists:
              fact_type: specific_king_ask
              status: pending
        - not:
            fact_exists:
              fact_type: final_contract
    call: 5N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: asker_has_four_keycards
          evaluator: expression
          expr:
            op: eq
            left:
              op: keycard_count
              hand: self
              trump_suit:
                op: fact_attribute
                query:
                  fact_type: keycard_response
                  method: "1430"
                attribute: trump_suit
            right: {const: 4}
          weight: 100
        - criterion_id: trump_queen_available
          evaluator: expression
          expr:
            op: contains_rank
            hand: self
            suit:
              op: fact_attribute
              query:
                fact_type: keycard_response
                method: "1430"
              attribute: trump_suit
            rank: Q
          weight: 20
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [inquiry]
      action_type: specific_king_ask
      alertable: true
    effects:
      - fact_type: all_keycards_known
        trump_suit:
          expr:
            op: fact_attribute
            query:
              fact_type: keycard_response
              method: "1430"
            attribute: trump_suit
        status: "yes"
      - fact_type: specific_king_ask
        trump_suit:
          expr:
            op: fact_attribute
            query:
              fact_type: keycard_response
              method: "1430"
            attribute: trump_suit
        status: pending

  - id: cs_7
    description: Responder shows the diamond king over the specific-king ask.
    system_notes: Over 5N specific-king ask, 6D shows the diamond king.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: specific_king_ask
            status: pending
        - not:
            fact_exists:
              fact_type: specific_king_response
    call: 6D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: has_diamond_king
          evaluator: expression
          expr:
            op: contains_rank
            hand: self
            suit: D
            rank: K
          weight: 100
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response, control_showing]
      action_type: specific_king_response
      target_suit: D
      alertable: true
    effects:
