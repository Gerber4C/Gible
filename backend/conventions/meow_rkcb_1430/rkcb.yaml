call_specifications:
  - id: cs_1
    description: Asker bids 4N as RKCB 1430 for the currently agreed suit.
    system_notes: When a suit is agreed and slam interest is present, 4N is RKCB 1430 for that suit.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: agreed_suit
        - not:
            fact_exists:
              fact_type: keycard_context
              status: pending
        - not:
            fact_exists:
              fact_type: final_contract
    call: 4N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: strong_slam_values
          evaluator: min_value
          input: self.hcp
          min: 18
          weight: 80
        - criterion_id: agreed_suit_length
          evaluator: expression
          expr:
            op: gte
            left:
              op: length
              hand: self
              suit:
                op: fact_attribute
                query:
                  fact_type: agreed_suit
                attribute: suit
            right: {const: 5}
          weight: 40
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [inquiry, keycard_asking]
      action_type: rkcb_1430
      target_suit_source: agreed_suit
      alertable: true
    effects:
      - fact_type: keycard_context
        trump_suit:
          expr:
            op: fact_attribute
            query:
              fact_type: agreed_suit
            attribute: suit
        method: "1430"
        status: pending

  - id: cs_2
    description: Responder to RKCB answers 5C, showing 1 or 4 keycards.
    system_notes: In RKCB 1430, 5C shows 1 or 4 keycards.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: keycard_context
            method: "1430"
            status: pending
        - not:
            fact_exists:
              fact_type: keycard_response
              method: "1430"
    call: 5C
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: one_or_four_keycards
          evaluator: expression
          expr:
            op: in
            left:
              op: keycard_count
              hand: self
              trump_suit:
                op: fact_attribute
                query:
                  fact_type: keycard_context
                  method: "1430"
                  status: pending
                attribute: trump_suit
            right: {const: [1, 4]}
          weight: 100
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: keycard_response
      keycard_range: [1, 4]
      alertable: true
    effects:
      - fact_type: keycard_response
        trump_suit:
          expr:
            op: fact_attribute
            query:
              fact_type: keycard_context
              method: "1430"
              status: pending
            attribute: trump_suit
        method: "1430"
        response: one_or_four

