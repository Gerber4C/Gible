  - id: cs_10
    description: Partner passes after a final contract has been placed.
    system_notes: After a final contract is placed, partner passes to end the auction.
    context:
      auction_pattern: "*"
    requires:
      fact_exists:
        fact_type: final_contract
        source: rkcb_1430
    call: P
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: final_contract_placed
          evaluator: fact_exists
          query:
            fact_type: final_contract
            source: rkcb_1430
          weight: 100
    meaning:
      nature_labels: [natural]
      call_act_types: [final_placement]
      action_type: pass_final_contract
      alertable: false
