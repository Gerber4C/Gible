    call: 5H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: two_keycards
          evaluator: expression
          expr:
            op: eq
            left:
              op: keycard_count
              hand: self
              trump_suit:
                op: fact_attribute
                query:
                  fact_type: keycard_context
                  method: "1430"
                  status: pending
                attribute: trump_suit
            right: {const: 2}
          weight: 100
        - criterion_id: lacks_trump_queen
          evaluator: expression
          expr:
            op: not
            arg:
              op: contains_rank
              hand: self
              suit:
                op: fact_attribute
                query:
                  fact_type: keycard_context
                  method: "1430"
                  status: pending
                attribute: trump_suit
              rank: Q
          weight: 20
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: keycard_response
      keycard_count: 2
      trump_queen: false
      alertable: true
    effects:
      - fact_type: keycard_response
        trump_suit:
          expr:
            op: fact_attribute
            query:
              fact_type: keycard_context
              method: "1430"
              status: pending
            attribute: trump_suit
        method: "1430"
        response: two_without_queen

