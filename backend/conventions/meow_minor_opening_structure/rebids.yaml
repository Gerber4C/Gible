  - id: cs_23
    description: Opener raises hearts after 1C-1H with four-card support.
    system_notes: After 1C-1H, 2H shows heart support and minimum opening values.
    context:
      auction_pattern: "1CP1HP"
      seat_positions: [1, 2, 3, 4]
    call: 2H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: four_heart_support
          evaluator: min_value
          input: self.hearts
          min: 4
          weight: 80
        - criterion_id: minimum_opening
          evaluator: range_contains
          input: self.hcp
          min: 12
          max: 14
          weight: 30
    meaning:
      nature_labels: [natural]
      call_act_types: [support_showing]
      action_type: raise
      target_suit: H
      alertable: false
    effects:
      - fact_type: agreed_suit
        suit: H
        source: minor_opener_raise
      - state:
          key: partnership.force_status
          namespace: public
          owner: partnership
          value: not_forcing
          source: simple_raise
      - state:
          key: partnership.agreed_suit
          namespace: public
          owner: partnership
          value: H
          source: minor_opener_raise

