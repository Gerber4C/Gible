call_specifications:
  - id: cs_18
    description: Opener rebids 1H after 1C-1D with a four-card heart suit.
    system_notes: After 1C-1D, 1H is natural and shows hearts.
    context:
      auction_pattern: "1CP1DP"
      seat_positions: [1, 2, 3, 4]
    call: 1H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: four_hearts
          evaluator: min_value
          input: self.hearts
          min: 4
          weight: 70
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive]
      action_type: opener_rebid
      target_suit: H
      shown_length_min: 4
      alertable: false
    effects:
      - fact_type: opener_rebid
        target_suit: H
        shown_length_min: 4
      - state:
          key: opener.length.H
          namespace: public
          owner: opener
          min_value: 4
          source: opener_rebid

  - id: cs_19
    description: Opener rebids 1S after 1C-1D with four spades and fewer than four hearts.
    system_notes: After 1C-1D, 1S is natural and shows spades.
    context:
      auction_pattern: "1CP1DP"
      seat_positions: [1, 2, 3, 4]
    call: 1S
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: four_spades
          evaluator: min_value
          input: self.spades
          min: 4
          weight: 70
        - criterion_id: hearts_not_first
          evaluator: expression
          expr:
            op: lte
            left:
              op: length
              hand: self
              suit: H
            right: {const: 3}
          weight: 20
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive]
      action_type: opener_rebid
      target_suit: S
      shown_length_min: 4
      alertable: false
    effects:
      - fact_type: opener_rebid
        target_suit: S
        shown_length_min: 4
      - state:
          key: opener.length.S
          namespace: public
          owner: opener
          min_value: 4
          source: opener_rebid

  - id: cs_20
    description: Opener rebids 1N after 1C-1D with 12-14 balanced values and no four-card major.
    system_notes: After 1C-1D, 1N shows a minimum balanced hand.
    context:
      auction_pattern: "1CP1DP"
      seat_positions: [1, 2, 3, 4]
    call: 1N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: twelve_to_fourteen
          evaluator: range_contains
          input: self.hcp
          min: 12
          max: 14
          weight: 70
        - criterion_id: balanced
          evaluator: equals
          input: self.balanced
          value: true
          weight: 20
        - criterion_id: no_four_card_major
          evaluator: expression
          expr:
            op: and
            args:
              - op: lte
                left:
                  op: length
                  hand: self
                  suit: H
                right: {const: 3}
              - op: lte
                left:
                  op: length
                  hand: self
                  suit: S
                right: {const: 3}
          weight: 20
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive]
      action_type: notrump_rebid
      hcp_range: [12, 14]
      alertable: false
    effects:
      - fact_type: opener_notrump_rebid
        hcp_min: 12
        hcp_max: 14
      - state:
          key: opener.hcp
          namespace: public
          owner: opener
          min_value: 12
          max_value: 14
          source: notrump_rebid
      - state:
          key: opener.shape
          namespace: public
          owner: opener
          value: balanced
          source: notrump_rebid
      - state:
          key: opener.length.H
          namespace: public
          owner: opener
          max_value: 3
          source: notrump_rebid_denial
      - state:
          key: opener.length.S
          namespace: public
          owner: opener
          max_value: 3
          source: notrump_rebid_denial

