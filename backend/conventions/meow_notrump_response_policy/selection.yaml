call_selection_policies:
  - id: policy_1
    description: Responder choice after 1N across Stayman, transfers, Texas, and other active 1N modules.
    scope:
      context:
        auction_pattern: "1NP"
        seat_positions: [1, 2, 3, 4]
    algorithm: highest_score
    tie_breaker: diagnose

  - id: policy_2
    description: Opener continuation after a club transfer.
    scope:
      context:
        auction_pattern: "1NP2SP"
        seat_positions: [1, 2, 3, 4]
    algorithm: highest_score
    tie_breaker: diagnose

  - id: policy_3
    description: Opener continuation after a diamond transfer.
    scope:
      context:
        auction_pattern: "1NP2NP"
        seat_positions: [1, 2, 3, 4]
    algorithm: highest_score
    tie_breaker: diagnose
