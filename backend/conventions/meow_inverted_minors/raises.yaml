call_specifications:
  - id: cs_1
    description: "Inverted raise 1C-2C: invitational or better club support, no four-card major, forcing to 2N or 3C."
    system_notes: After 1C, 2C is an inverted minor raise, invitational or better, denying a four-card major.
    context:
      auction_pattern: "1CP"
      seat_positions: [1, 2, 3, 4]
    call: 2C
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: invitational_plus
          evaluator: min_value
          input: self.hcp
          min: 10
          weight: 80
        - criterion_id: five_card_club_support
          evaluator: min_value
          input: self.clubs
          min: 5
          weight: 70
        - criterion_id: no_four_card_major
          evaluator: expression
          expr:
            op: and
            args:
              - op: lte
                left:
                  op: length
                  hand: self
                  suit: H
                right: {const: 3}
              - op: lte
                left:
                  op: length
                  hand: self
                  suit: S
                right: {const: 3}
          weight: 30
    meaning:
      nature_labels: [conventional]
      call_act_types: [support_showing, forcing, context_initiating]
      action_type: inverted_minor_raise
      target_suit: C
      raise_strength: invitational_plus
      alertable: true
    effects:
      - fact_type: minor_raise
        target_suit: C
        strength: invitational_plus
        method: inverted_minor
      - fact_type: agreed_suit
        suit: C
        source: inverted_minor
      - fact_type: forcing_status
        status: forcing_to_2N_or_3m
        target_suit: C

  - id: cs_2
