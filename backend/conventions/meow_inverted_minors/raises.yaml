    system_notes: After 1D, 2D is an inverted minor raise, invitational or better, denying a four-card major.
    context:
      auction_pattern: "1DP"
      seat_positions: [1, 2, 3, 4]
    call: 2D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: invitational_plus
          evaluator: min_value
          input: self.hcp
          min: 10
          weight: 80
        - criterion_id: four_card_diamond_support
          evaluator: min_value
          input: self.diamonds
          min: 4
          weight: 70
        - criterion_id: no_four_card_major
          evaluator: expression
          expr:
            op: and
            args:
              - op: lte
                left:
                  op: length
                  hand: self
                  suit: H
                right: {const: 3}
              - op: lte
                left:
                  op: length
                  hand: self
                  suit: S
                right: {const: 3}
          weight: 30
    meaning:
      nature_labels: [conventional]
      call_act_types: [support_showing, forcing, context_initiating]
      action_type: inverted_minor_raise
      target_suit: D
      raise_strength: invitational_plus
      alertable: true
    effects:
      - fact_type: minor_raise
        target_suit: D
        strength: invitational_plus
        method: inverted_minor
      - fact_type: agreed_suit
        suit: D
        source: inverted_minor
      - fact_type: forcing_status
        status: forcing_to_2N_or_3m
