  - id: cs_3
    description: Opener rebids 2N after 1C-2C with a minimum balanced hand and stoppers in the side suits.
    system_notes: After 1C-2C, 2N shows a minimum balanced hand with side-suit stoppers.
    context:
      auction_pattern: "1CP2CP"
      seat_positions: [1, 2, 3, 4]
    call: 2N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: minimum_balanced
          evaluator: range_contains
          input: self.hcp
          min: 12
          max: 14
          weight: 70
        - criterion_id: balanced
          evaluator: equals
          input: self.balanced
          value: true
          weight: 40
        - criterion_id: diamond_stopper
          evaluator: named_evaluator
          evaluator_id: eval_stopper
          params: {target_suit: D}
          weight: 40
        - criterion_id: heart_stopper
          evaluator: named_evaluator
          evaluator_id: eval_stopper
          params: {target_suit: H}
          weight: 40
        - criterion_id: spade_stopper
          evaluator: named_evaluator
          evaluator_id: eval_stopper
          params: {target_suit: S}
          weight: 40
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive, context_setting]
      action_type: stopper_notrump_rebid
      target_suit: N
      level: 2
      alertable: false
    effects:
      - fact_type: notrump_contract_interest
        level: 2
        source: inverted_minor

  - id: cs_4
    description: Opener shows a diamond stopper after 1C-2C when not making the immediate 2N rebid.
    system_notes: After 1C-2C, 2D shows a diamond stopper up the line.
    context:
      auction_pattern: "1CP2CP"
      seat_positions: [1, 2, 3, 4]
    call: 2D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: diamond_stopper
          evaluator: named_evaluator
          evaluator_id: eval_stopper
          params: {target_suit: D}
          weight: 180
    meaning:
      nature_labels: [natural]
      call_act_types: [stopper_showing, forcing]
      action_type: stopper_bid
      target_suit: D
      alertable: false
    effects:
      - fact_type: stopper
        suit: D
        source: inverted_minor

  - id: cs_5
    description: Opener shows a heart stopper after 1C-2C when no diamond stopper has been shown.
    system_notes: After 1C-2C, 2H shows a heart stopper when diamonds were not stopped.
    context:
      auction_pattern: "1CP2CP"
      seat_positions: [1, 2, 3, 4]
    call: 2H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: no_diamond_stopper
          evaluator: expression
          expr:
            op: not
            arg:
              op: fact_exists
              query:
                fact_type: stopper
                suit: D
          weight: 10
        - criterion_id: heart_stopper
          evaluator: named_evaluator
          evaluator_id: eval_stopper
          params: {target_suit: H}
          weight: 170
        - criterion_id: lacks_diamond_stopper
          evaluator: expression
          expr:
            op: not
            arg:
              op: or
              args:
                - op: contains_rank
                  hand: self
                  suit: D
                  rank: A
                - op: contains_rank
                  hand: self
                  suit: D
                  rank: K
                - op: and
                  args:
                    - op: contains_rank
                      hand: self
                      suit: D
                      rank: Q
                    - op: gte
                      left:
                        op: length
                        hand: self
                        suit: D
                      right: {const: 2}
          weight: 10
    meaning:
      nature_labels: [natural]
      call_act_types: [stopper_showing, forcing]
      action_type: stopper_bid
      target_suit: H
      alertable: false
    effects:
      - fact_type: stopper
        suit: H
        source: inverted_minor

