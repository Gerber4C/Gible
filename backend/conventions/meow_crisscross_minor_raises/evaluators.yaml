named_evaluators:
  - id: eval_crisscross_stopper
    evaluator_type: expression
    description: Stopper evaluator used by crisscross notrump continuations.
    definition:
      op: or
      args:
        - op: contains_rank
          hand: self
          suit: {param: target_suit}
          rank: A
        - op: contains_rank
          hand: self
          suit: {param: target_suit}
          rank: K
        - op: and
          args:
            - op: contains_rank
              hand: self
              suit: {param: target_suit}
              rank: Q
            - op: gte
              left:
                op: length
                hand: self
                suit: {param: target_suit}
              right: {const: 2}
