call_specifications:
  - id: cs_1
    description: Asker bids 5N to ask specifically for the diamond king after a 1430 zero-or-three response.
    system_notes: After 4N-5D in a heart RKCB auction, 5N asks whether partner holds the diamond king.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: keycard_response
            method: "1430"
            trump_suit: H
            response: zero_or_three
        - not:
            fact_exists:
              fact_type: targeted_king_ask
              status: pending
        - not:
            fact_exists:
              fact_type: final_contract
    call: 5N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: heart_grand_try_values
          evaluator: min_value
          input: self.hcp
          min: 18
          weight: 110
        - criterion_id: six_hearts
          evaluator: min_value
          input: self.hearts
          min: 6
          weight: 60
        - criterion_id: asker_has_three_keycards
          evaluator: expression
          expr:
            op: eq
            left:
              op: keycard_count
              hand: self
              trump_suit: H
            right: {const: 3}
          weight: 60
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [inquiry, honor_asking]
      action_type: targeted_king_ask
      target_suit: D
      target_rank: K
      trump_suit: H
      alertable: true
    effects:
      - fact_type: targeted_king_ask
        trump_suit: H
        target_suit: D
        rank: K
        status: pending
      - fact_type: all_keycards_known
        trump_suit: H
        status: "yes"

  - id: cs_2
    description: Responder bids 6D to show the diamond king over the targeted king ask.
    system_notes: Over the targeted 5N ask, 6D shows the diamond king.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: targeted_king_ask
            trump_suit: H
            target_suit: D
            rank: K
            status: pending
        - not:
            fact_exists:
              fact_type: targeted_king_response
              target_suit: D
              rank: K
    call: 6D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: has_diamond_king
          evaluator: expression
          expr:
            op: contains_rank
            hand: self
            suit: D
            rank: K
          weight: 100
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response, control_showing]
      action_type: targeted_king_response
      target_suit: D
      target_rank: K
      alertable: true
    effects:
      - fact_type: targeted_king_response
        trump_suit: H
        target_suit: D
        rank: K
        status: "yes"

  - id: cs_3
    description: Asker places the heart grand slam after the diamond king is confirmed.
    system_notes: 7H is final placement after partner shows the diamond king in the heart-slam route.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: targeted_king_response
            trump_suit: H
            target_suit: D
            rank: K
            status: "yes"
        - not:
            fact_exists:
              fact_type: final_contract
    call: 7H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: final_grand_strength
          evaluator: min_value
          input: self.hcp
          min: 18
          weight: 100
        - criterion_id: six_hearts
          evaluator: min_value
          input: self.hearts
          min: 6
          weight: 20
    meaning:
      nature_labels: [natural]
      call_act_types: [final_placement]
      action_type: place_contract
      target_suit: H
      level: 7
      alertable: false
    effects:
      - fact_type: final_contract
        target_suit: H
        level: 7
        source: targeted_king_ask

  - id: cs_4
    description: Partner passes after the targeted-king route places a final contract.
    system_notes: After 7H is placed, partner passes to end the auction.
    context:
      auction_pattern: "*"
    requires:
      fact_exists:
        fact_type: final_contract
        source: targeted_king_ask
    call: P
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: final_contract_placed
          evaluator: fact_exists
          query:
            fact_type: final_contract
            source: targeted_king_ask
          weight: 100
    meaning:
      nature_labels: [natural]
      call_act_types: [final_placement]
      action_type: pass_final_contract
      alertable: false
