call_specifications:
  - id: cs_1
    description: Asker bids 5D as Exclusion keycard for hearts, excluding the diamond ace.
    system_notes: With hearts agreed and diamond void, 5D asks for heart keycards excluding the diamond ace.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: agreed_suit
            suit: H
        - not:
            fact_exists:
              fact_type: keycard_context
              status: pending
        - not:
            fact_exists:
              fact_type: final_contract
    call: 5D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: heart_slam_values
          evaluator: min_value
          input: self.hcp
          min: 16
          weight: 90
        - criterion_id: six_hearts
          evaluator: min_value
          input: self.hearts
          min: 6
          weight: 60
        - criterion_id: diamond_void
          evaluator: expression
          expr:
            op: eq
            left:
              op: length
              hand: self
              suit: D
            right: {const: 0}
          weight: 120
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [inquiry, keycard_asking, shortness_showing, context_initiating]
      action_type: exclusion_1430
      target_suit: H
      excluded_suit: D
      alertable: true
    effects:
      - fact_type: keycard_context
        trump_suit: H
        method: exclusion_1430
        excluded_suit: D
        status: pending

  - id: cs_2
    description: Responder to Exclusion answers 5H, showing 1 or 4 keycards outside diamonds.
    system_notes: Over 5D Exclusion for hearts, 5H shows 1 or 4 keycards excluding the diamond ace.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: keycard_context
            method: exclusion_1430
            trump_suit: H
            excluded_suit: D
            status: pending
        - not:
            fact_exists:
              fact_type: keycard_response
              method: exclusion_1430
    call: 5H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: one_or_four_excluding_diamonds
          evaluator: expression
          expr:
            op: in
            left:
              op: keycard_count
              hand: self
              trump_suit: H
              excluded_suit: D
            right: {const: [1, 4]}
          weight: 100
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: keycard_response
      keycard_range: [1, 4]
      excluded_suit: D
      alertable: true
    effects:
      - fact_type: keycard_response
        trump_suit: H
        method: exclusion_1430
        excluded_suit: D
        response: one_or_four

  - id: cs_3
    description: Responder to Exclusion answers 5S, showing 0 or 3 keycards outside diamonds.
    system_notes: Over 5D Exclusion for hearts, 5S shows 0 or 3 keycards excluding the diamond ace.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: keycard_context
            method: exclusion_1430
            trump_suit: H
            excluded_suit: D
            status: pending
        - not:
            fact_exists:
              fact_type: keycard_response
              method: exclusion_1430
    call: 5S
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: zero_or_three_excluding_diamonds
          evaluator: expression
          expr:
            op: in
            left:
              op: keycard_count
              hand: self
              trump_suit: H
              excluded_suit: D
            right: {const: [0, 3]}
          weight: 100
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: keycard_response
      keycard_range: [0, 3]
      excluded_suit: D
      alertable: true
    effects:
      - fact_type: keycard_response
        trump_suit: H
        method: exclusion_1430
        excluded_suit: D
        response: zero_or_three

  - id: cs_4
    description: Responder to Exclusion answers 5N, showing two keycards outside diamonds without the heart queen.
    system_notes: Over 5D Exclusion for hearts, 5N shows 2 keycards excluding the diamond ace and denies the heart queen.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: keycard_context
            method: exclusion_1430
            trump_suit: H
            excluded_suit: D
            status: pending
        - not:
            fact_exists:
              fact_type: keycard_response
              method: exclusion_1430
    call: 5N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: two_excluding_diamonds
          evaluator: expression
          expr:
            op: eq
            left:
              op: keycard_count
              hand: self
              trump_suit: H
              excluded_suit: D
            right: {const: 2}
          weight: 100
        - criterion_id: lacks_heart_queen
          evaluator: expression
          expr:
            op: not
            arg:
              op: contains_rank
              hand: self
              suit: H
              rank: Q
          weight: 20
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: keycard_response
      keycard_count: 2
      trump_queen: false
      excluded_suit: D
      alertable: true
    effects:
      - fact_type: keycard_response
        trump_suit: H
        method: exclusion_1430
        excluded_suit: D
        response: two_without_queen
