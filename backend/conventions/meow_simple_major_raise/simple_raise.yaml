call_specifications:
  - id: cs_1
    description: Responder gives a simple spade raise with exactly three-card support and non-forcing values.
    system_notes: After 1S, 2S is a natural simple raise. In this benchmark, Bergen handles four-card constructive and limit raises.
    context:
      auction_pattern: "1SP"
      seat_positions: [1, 2]
    call: 2S
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: exactly_three_spades
          evaluator: expression
          expr:
            op: eq
            left: {var: self.spades.length}
            right: {const: 3}
          weight: 50
        - criterion_id: simple_raise_values
          evaluator: range_contains
          input: self.hcp
          min: 6
          max: 10
          weight: 50
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive]
      action_type: simple_raise
      target_suit: S
      support_length: 3
      raise_strength: simple
      alertable: false
    effects:
      - fact_type: agreed_suit
        suit: S
        source: simple_raise
      - fact_type: major_raise
        suit: S
        raise_type: simple

  - id: cs_2
    description: Responder gives a simple heart raise with exactly three-card support and non-forcing values.
    system_notes: After 1H, 2H is a natural simple raise. In this benchmark, Bergen handles four-card constructive and limit raises.
    context:
      auction_pattern: "1HP"
      seat_positions: [1, 2]
    call: 2H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: exactly_three_hearts
          evaluator: expression
          expr:
            op: eq
            left: {var: self.hearts.length}
            right: {const: 3}
          weight: 50
        - criterion_id: simple_raise_values
          evaluator: range_contains
          input: self.hcp
          min: 6
          max: 10
          weight: 50
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive]
      action_type: simple_raise
      target_suit: H
      support_length: 3
      raise_strength: simple
      alertable: false
    effects:
      - fact_type: agreed_suit
        suit: H
        source: simple_raise
      - fact_type: major_raise
        suit: H
        raise_type: simple
