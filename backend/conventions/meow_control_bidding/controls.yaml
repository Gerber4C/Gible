call_specifications:
  - id: cs_1
    description: Responder bids 4D after a heart-transfer superaccept to show diamond control and continue slam exploration.
    system_notes: After 1N-2D-3H, 4D shows diamond control and heart-slam interest.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: agreed_suit
            suit: H
        - fact_exists:
            fact_type: transfer_superaccept
            target_suit: H
            status: accepted
        - not:
            fact_exists:
              fact_type: keycard_context
              status: pending
        - not:
            fact_exists:
              fact_type: final_contract
    call: 4D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: heart_slam_values
          evaluator: min_value
          input: self.hcp
          min: 16
          weight: 90
        - criterion_id: six_hearts
          evaluator: min_value
          input: self.hearts
          min: 6
          weight: 60
        - criterion_id: diamond_control
          evaluator: expression
          expr:
            op: or
            args:
              - op: contains_rank
                hand: self
                suit: D
                rank: A
              - op: contains_rank
                hand: self
                suit: D
                rank: K
              - op: lte
                left:
                  op: length
                  hand: self
                  suit: D
                right: {const: 1}
          weight: 110
    meaning:
      nature_labels: [conventional]
      call_act_types: [control_showing, slam_try, context_setting]
      action_type: control_bid
      target_suit: D
      agreed_suit: H
      control_round: first_or_second
      alertable: false
    effects:
      - fact_type: control
        suit: D
        agreed_suit: H
        round: first_or_second
        status: shown
      - fact_type: slam_interest
        agreed_suit: H
        status: active
        source: control_bid
