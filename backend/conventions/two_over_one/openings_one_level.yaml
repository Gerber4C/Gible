  - id: cs_7
    description: Placeholder seat 3 or 4 major opening enabled only by an environment flag.
    system_notes: Seat 3 or 4 major openings are a placeholder in this checkpoint.
    context:
      auction_pattern: ""
      seat_positions: [3, 4]
    call: 1H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: four_card_heart_length
          evaluator: min_value
          input: self.hearts
          min: 4
          weight: 20
        - criterion_id: placeholder_major_opening_policy
          evaluator: equals
          input: env.enable_placeholder_openings
          value: true
          weight: 1
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive, context_initiating]
      action_type: opening
      target_suit: H
      alertable: false

