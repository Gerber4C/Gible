call_specifications:
  - id: cs_3
    description: Opens 1H in seat 1 or 2 with opening values and at least five hearts.
    system_notes: In seat 1 or 2, 1H is natural and shows at least five hearts.
    context:
      auction_pattern: ""
      seat_positions: [1, 2]
    call: 1H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: opening_values
          evaluator: min_value
          input: self.hcp
          min: 12
          weight: 40
        - criterion_id: five_card_heart_length
          evaluator: min_value
          input: self.hearts
          min: 5
          weight: 60
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive, context_initiating]
      action_type: opening
      target_suit: H
      shown_length_min: 5
      alertable: false

