call_specifications:
  - id: cs_9
    description: Opens artificial strong 2C with very strong values.
    system_notes: 2C opening is artificial, conventional, game forcing, and alertable.
    context:
      auction_pattern: ""
      seat_positions: [1, 2, 3, 4]
    call: 2C
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: strong_two_club_values
          evaluator: min_value
          input: self.hcp
          min: 22
          weight: 100
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [context_initiating, forcing]
      action_type: strong_opening
      forcing_status: game_forcing
      alertable: true

  - id: cs_10
