          input: self.diamonds
          min: 6
          weight: 60
        - criterion_id: weak_two_hcp_range
          evaluator: range_contains
          input: self.hcp
          min: 6
          max: 10
          weight: 40
    meaning:
      nature_labels: [natural]
      call_act_types: [descriptive, preemptive]
      action_type: preemptive_opening
      target_suit: D
      shown_length_min: 6
      alertable: false

