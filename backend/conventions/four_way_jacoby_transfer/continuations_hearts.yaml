call_specifications:
  - id: cs_2
    description: Opener completes the heart transfer at 2H.
    system_notes: After a heart transfer, 2H is the normal completion.
    context:
      auction_pattern: "1NP2DP"
      seat_positions: [1, 2, 3, 4]
    call: 2H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: pending_heart_transfer
          evaluator: fact_exists
          query:
            fact_type: transfer
            target_suit: H
            status: pending
          weight: 80
    meaning:
      nature_labels: [conventional]
      call_act_types: [directive, context_setting]
      action_type: transfer_completion
      target_suit: H
      alertable: false
    effects:
      - fact_type: transfer_completion
        target_suit: H
        status: completed

  - id: cs_3
    description: Opener superaccepts the heart transfer at 3H with maximum-ish values and four-card support.
    system_notes: After a heart transfer, 3H is a superaccept and is alertable in this prototype.
    context:
      auction_pattern: "1NP2DP"
      seat_positions: [1, 2, 3, 4]
    call: 3H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: pending_heart_transfer
          evaluator: fact_exists
          query:
            fact_type: transfer
            target_suit: H
            status: pending
          weight: 40
        - criterion_id: maximumish_notrump_values
          evaluator: min_value
          input: self.hcp
          min: 16
          weight: 30
        - criterion_id: four_card_heart_support
          evaluator: min_value
          input: self.hearts
          min: 4
          weight: 30
    meaning:
      nature_labels: [conventional]
      call_act_types: [directive, context_setting]
      action_type: superaccept
      target_suit: H
      alertable: true
    effects:
      - fact_type: transfer_superaccept
        target_suit: H
        status: accepted


