call_specifications:
  - id: cs_1
    description: Opens a weak 2D with a six-card diamond suit, adjusted by seat and vulnerability.
    system_notes: 2D is weak and natural; style varies by seat and vulnerability.
    context:
      auction_pattern: ""
      seat_positions: [1, 2, 3]
    call: 2D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: weak_two_context
          evaluator: named_evaluator
          evaluator_id: eval_weak_two_opening
          params: {target_suit: D}
          weight: 150
    meaning:
      nature_labels: [natural, weak]
      call_act_types: [preemptive, descriptive, context_initiating]
      action_type: weak_two_opening
      target_suit: D
      shown_length_min: 6
      alertable: false
    effects:
      - fact_type: preemptive_opening
        level: 2
        target_suit: D
        style: seat_and_vulnerability_dependent

