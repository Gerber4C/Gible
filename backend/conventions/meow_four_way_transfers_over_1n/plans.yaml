bidding_plans:
  - id: plan_1
    description: Weak heart-transfer signoff plan.
    system_notes: With 5+ hearts and 0-6 HCP, responder may transfer to hearts and pass opener's acceptance.
    owner: responder
    goal: signoff
    context:
      auction_pattern: "1NP"
      seat_positions: [1, 2, 3, 4]
    preconditions:
      all:
        - self.hearts: {min: 5}
        - self.hcp: {max: 6}
    entry_call: 2D
    workflow:
      start: wait_1
      nodes:
        wait_1:
          kind: wait_for_call
          actor: opener
          branches:
            - when:
                kind: call_is
                value: 2H
              goto: make_1
            - when:
                kind: call_is
                value: 3H
              goto: make_1
        make_1:
          kind: make_call
          call: P
          score: 100
          meaning:
            nature_labels: [natural]
            call_act_types: [signoff, final_placement]
            action_type: final_placement
            target_suit: H
            alertable: false

  - id: plan_2
    description: Heart-transfer slam exploration plan after a superaccept.
    system_notes: With a strong long-heart hand, responder can start with 2D; if opener superaccepts at 3H, responder may use 4N as RKCB for hearts.
    owner: responder
    goal: ask_keycards
    context:
      auction_pattern: "1NP"
      seat_positions: [1, 2, 3, 4]
    preconditions:
      all:
        - self.hearts: {min: 6}
        - self.hcp: {min: 16}
    entry_candidate: true
    entry_call: 2D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: six_hearts
          evaluator: min_value
          input: self.hearts
          min: 6
          weight: 70
        - criterion_id: slam_values
          evaluator: min_value
          input: self.hcp
          min: 16
          weight: 90
    workflow:
      start: wait_1
      nodes:
        wait_1:
          kind: wait_for_call
          actor: opener
          branches:
            - when:
                kind: call_is
                value: 3H
              goto: make_1
        make_1:
          kind: make_call
          call: 4N
          score: 180
          requires_call_specification: true
          requires:
            all:
              - state_has:
                  agreed_suit:
                    suit: H
              - state_has:
                  transfer_superaccept:
                    target_suit: H
                    status: accepted
