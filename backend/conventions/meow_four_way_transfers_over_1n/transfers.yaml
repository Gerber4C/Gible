call_specifications:
  - id: cs_1
    description: Responder bids 2D as a transfer to hearts with at least five hearts.
    system_notes: After 1N, 2D transfers to hearts.
    context:
      auction_pattern: "1NP"
      seat_positions: [1, 2, 3, 4]
    requires:
      fact_exists:
        fact_type: notrump_focus
        status: active
    call: 2D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: five_hearts
          evaluator: min_value
          input: self.hearts
          min: 5
          weight: 70
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [directive, context_initiating, forcing]
      action_type: transfer
      target_suit: H
      alertable: true
      acbl_explanation: hearts
    effects:
      - fact_type: transfer
        target_suit: H
        status: pending

