    system_notes: After 1N-2D, 2H completes the heart transfer.
    context:
      auction_pattern: "1NP2DP"
      seat_positions: [1, 2, 3, 4]
    requires:
      state_has:
        transfer:
          target_suit: H
          status: pending
    call: 2H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: pending_heart_transfer
          evaluator: fact_exists
          query:
            fact_type: transfer
            target_suit: H
            status: pending
          weight: 10
    meaning:
      nature_labels: [conventional]
      call_act_types: [directive, context_setting]
      action_type: transfer_completion
      target_suit: H
      alertable: false
    effects:
      - fact_type: transfer_completion
        target_suit: H
        status: completed

