call_specifications:
  - id: cs_1
    description: Normal Bergen 3C constructive four-card spade raise.
    system_notes: After 1S, 3C is a constructive four-card Bergen raise.
    context:
      auction_pattern: "1SP"
      seat_positions: [1, 2]
    call: 3C
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: four_spades
          evaluator: min_value
          input: self.spades
          min: 4
          weight: 50
        - criterion_id: constructive_values
          evaluator: range_contains
          input: self.hcp
          min: 7
          max: 9
          weight: 40
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [descriptive]
      action_type: bergen_raise
      target_suit: S
      raise_strength: constructive
      alertable: true
    effects:
      - fact_type: agreed_suit
        suit: S
        source: bergen_raise
      - fact_type: major_raise
        suit: S
        raise_type: bergen_constructive

