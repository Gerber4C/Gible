call_specifications:
  - id: cs_1
    description: Responder bids 4C as Gerber over a notrump-focused auction.
    system_notes: After a notrump focus with no agreed suit, 4C asks for aces.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: notrump_focus
            status: active
        - not:
            fact_exists:
              fact_type: agreed_suit
        - not:
            fact_exists:
              fact_type: transfer
              status: pending
        - not:
            fact_exists:
              fact_type: stayman
              status: pending
        - not:
            fact_exists:
              fact_type: ace_ask_context
              status: pending
        - not:
            fact_exists:
              fact_type: final_contract
    call: 4C
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: notrump_slam_values
          evaluator: min_value
          input: self.hcp
          min: 18
          weight: 150
        - criterion_id: balanced_or_semibalanced
          evaluator: equals
          input: self.balanced
          value: true
          weight: 30
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [inquiry, ace_asking, context_initiating]
      action_type: gerber_ace_ask
      target_suit: N
      alertable: true
    effects:
      - fact_type: ace_ask_context
        method: gerber
        target_suit: N
        status: pending

  - id: cs_2
    description: Responder to Gerber answers 4D, showing zero or four aces.
    system_notes: Over 4C Gerber, 4D shows 0 or 4 aces.
    context:
      auction_pattern: "*"
    requires:
      all:
        - fact_exists:
            fact_type: ace_ask_context
            method: gerber
            status: pending
        - not:
            fact_exists:
              fact_type: ace_ask_response
              method: gerber
    call: 4D
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: zero_or_four_aces
          evaluator: expression
          expr:
            op: in
            left:
              op: ace_count
              hand: self
            right: {const: [0, 4]}
          weight: 100
    meaning:
      nature_labels: [artificial, conventional]
      call_act_types: [relay_response]
      action_type: ace_ask_response
      ace_range: [0, 4]
      alertable: true
    effects:
      - fact_type: ace_ask_response
        method: gerber
        response: zero_or_four

