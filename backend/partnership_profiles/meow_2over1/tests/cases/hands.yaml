valid:
  - name: any_suit_order_and_10_alias
    hand: H8763SK10C2DAKQ987
    expected:
      spades: KT
      hearts: '8763'
      diamonds: AKQ987
      clubs: '2'
      hcp: 12

  - name: repeated_suit_sections_are_concatenated
    hand: S9S8HAKQJD7654C432
    expected:
      spades: '98'
      hearts: AKQJ
      diamonds: '7654'
      clubs: '432'
      hcp: 10

  - name: void_marker_and_x_placeholders
    hand: SAKQJH-DxxxxCxxxxx
    expected:
      spades: AKQJ
      hearts: ''
      diamonds: XXXX
      clubs: XXXXX
      hcp: 10

invalid:
  - name: wrong_card_count
    hand: SAKQHJT9D876C54
    error_contains: Wrong number of cards

  - name: repeated_known_card
    hand: SASAHKQJTD987C654
    error_contains: Repeated card

  - name: unknown_symbol
    hand: SAZHKQJTD987C654
    error_contains: Unknown symbol

  - name: rank_before_suit
    hand: ASAKQHJT9D876C54
    error_contains: Rank appears before suit marker

  - name: bad_single_one
    hand: S1HKQJTD987C65432
    error_contains: use 10 or T

  - name: void_marker_with_cards
    hand: S-AHKQJTD987C654
    error_contains: Void marker

  - name: dictionary_input_rejected
    hand:
      spades: AKQ
      hearts: JT9
      diamonds: '876'
      clubs: '5432'
    error_contains: compact string
